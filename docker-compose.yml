services:
  postgres:
    image: postgres:17-alpine
    container_name: peace-motive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: peace_motive
      POSTGRES_USER: peace_motive
      POSTGRES_PASSWORD: peace_motive_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - peace_motive_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peace_motive -d peace_motive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peace_motive_data:
